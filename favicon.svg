  <!-- Inner precision ring -->
  <circle cx="16" cy="16" r="10" stroke="#FFB800" stroke-width="1" stroke-opacity="0.8"/>
  <!-- Cardinal axis marks -->
  <line x1="16" y1="2" x2="16" y2="5" stroke="#FFB800" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="27" x2="16" y2="30" stroke="#FFB800" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="16" x2="5" y2="16" stroke="#FFB800" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="16" x2="30" y2="16" stroke="#FFB800" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Central core dot -->
  <circle cx="16" cy="16" r="2.5" fill="#FFB800"/>
</svg>
